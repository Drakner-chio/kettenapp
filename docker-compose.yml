services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ketten
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ketten
    volumes:
      - /mnt/user/appdata/kettenapp/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ketten"]
      interval: 5s
      retries: 10

  app:
    image: ghcr.io/drakner-chio/kettenapp:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://ketten:${DB_PASSWORD}@db/ketten
      SECRET_KEY: ${SECRET_KEY}
      APP_PASSWORD: ${APP_PASSWORD}
      BASE_URL: ${BASE_URL}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
    volumes:
      - /mnt/user/appdata/kettenapp/uploads:/data/uploads
    ports:
      # im LAN unter http://UNRAID-IP:8010 erreichbar; der Reverse Proxy leitet hierhin weiter
      - "${APP_PORT:-8010}:8000"
