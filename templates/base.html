<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ketten</title>
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
<meta name="theme-color" content="#fc4c02">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ketten">
<style>
  :root { --bg:#f4f5f7; --card:#fff; --fg:#1b1f24; --mut:#6b7480; --line:#dfe3e8; --acc:#fc4c02; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171a; --card:#1e2227; --fg:#e8eaed; --mut:#98a1ac; --line:#30363d; }
  }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font:16px/1.45 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; }
  header a { color:var(--fg); text-decoration:none; font-weight:700; font-size:1.15rem; }
  main { max-width:640px; margin:0 auto; padding:0 16px 48px; }
  h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--mut); margin:28px 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .big { font-size:1.5rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .mut { color:var(--mut); font-size:.9rem; }
  a { color:var(--acc); }
  .badge { font-size:.75rem; padding:2px 8px; border-radius:99px; border:1px solid var(--line); white-space:nowrap; }
  .ok { background:#1f883d; color:#fff; border-color:transparent; }
  .bald { background:#bf8700; color:#fff; border-color:transparent; }
  .wechseln, .verschlissen { background:#cf222e; color:#fff; border-color:transparent; }
  .bar { height:6px; border-radius:3px; background:var(--line); overflow:hidden; margin-top:6px; }
  .bar > i { display:block; height:100%; background:#1f883d; }
  .bar > i.bald { background:#bf8700; } .bar > i.wechseln, .bar > i.verschlissen { background:#cf222e; }
  form.stack { display:grid; gap:8px; margin-top:10px; }
  input, select, button { font:inherit; padding:10px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg); color:var(--fg); width:100%; }
  button { background:var(--acc); color:#fff; border:0; font-weight:600; cursor:pointer; }
  button.plain { background:none; color:var(--mut); border:1px solid var(--line); width:auto; padding:4px 10px; font-weight:400; }
  details summary { cursor:pointer; font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:.92rem; }
  td, th { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .flash { background:var(--card); border-left:4px solid var(--acc); padding:10px 12px; border-radius:6px; }
  .thumb { width:56px; height:56px; object-fit:cover; border-radius:8px; flex:none; background:var(--line); }
  .photo { width:100%; max-height:340px; object-fit:cover; border-radius:10px; margin-bottom:10px; display:block; }
  .item { display:flex; gap:12px; align-items:center; }
  .item > .grow { flex:1; min-width:0; }
  a.block { text-decoration:none; color:inherit; display:block; }
  .sub { margin-left:18px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
</style>
</head>
<body>
<header>
  <a href="{{ url_for('index') }}">⛓ Ketten</a>
  {% if session.get('ok') %}
  <form method="post" action="{{ url_for('logout') }}"><button class="plain">Abmelden</button></form>
  {% endif %}
</header>
<main>
{% for m in get_flashed_messages() %}<p class="flash">{{ m }}</p>{% endfor %}
{% block body %}{% endblock %}
</main>
</body>
</html>
